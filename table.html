

<!DOCTYPE html>
<html>
<head>
    <title>Making a Table</title>
    <style>
        body {
            background-color: lightpink;
        }
        table {
            margin: 0 auto;
            width: 80%;
            color: darkred;
        }
        h1 {
            text-align: center;
            color: red;
            background-color: yellow;
        }
        table, th, td {
            border: 2px dotted black;
            border-collapse: collapse;
            background-color: lightblue;
        }
        th, td {
            padding: 10px;
        }
    </style>    
</head>
<body>
    <h1>Record Table</h1>
    <p> <b> This table shows the information of students.</b></p>
    <table>
        <tr> 
            <th colspan="4">Student Information</th>
        </tr>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Roll no.</th>
            <th>course</th>
        </tr>
        <tr>
            <td>SUMIT</td>
            <td>18</td>
            <td>1</td>
            <td>BCA</td>
        </tr>
        <tr>
            <td>RAJ</td>
            <td>17</td>
            <td>2</td>
            <td>BCA</td>
        </tr>
        <tr>
            <td>RAVI</td>
            <td>19</td>
            <td>1 </td>
            <td>MCA</td>         
        </tr>
    </table>
</body>
</html>
